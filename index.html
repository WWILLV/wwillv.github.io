<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Offline</title>

<style>
:root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --text:#1f2937;
    --secondary:#6b7280;
    --border:#e5e7eb;
    --shadow:0 16px 40px rgba(15,23,42,.08);
    --accent:#2563eb;
}
html.dark{
    --bg:#0b1220;
    --card:#111827;
    --text:#f3f4f6;
    --secondary:#9ca3af;
    --border:#1f2937;
    --shadow:0 20px 60px rgba(0,0,0,.45);
    --accent:#60a5fa;
}
html.dark .icon{
    background:rgba(96,165,250,.12);
    border-color:rgba(96,165,250,.25);
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at top,
            rgba(37,99,235,.08),
            transparent 42%),
        var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:
        background .25s ease,
        color .25s ease;
}
.container{
    width:min(92%,540px);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:48px;
    text-align:center;
    box-shadow:var(--shadow);
    transition:.25s;
}
.icon{
    width:76px;
    height:76px;
    margin:0 auto 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    border-radius:50%;
    background:rgba(37,99,235,.10);
    border:1px solid rgba(37,99,235,.20);
}
h1{
    font-size:2rem;
    font-weight:700;
    margin-bottom:16px;
}
p{
    color:var(--secondary);
    line-height:1.7;
    font-size:1rem;
}
.status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:28px;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(37,99,235,.08);
    color:var(--accent);
    font-size:.9rem;
    font-weight:600;
}
.status::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent);
}
button{
    margin-top:36px;
    background:none;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:.95rem;
    transition:.2s;
}
button:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
}
footer{
    margin-top:34px;
    font-size:.85rem;
    color:var(--secondary);
    line-height:1.6;
}
#lastUpdate{
    font-weight:500;
}
</style>
</head>

<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>Website Temporarily Offline</h1>
    <p>
        The website is temporarily unavailable.
        <br>
        Please check back again later.
    </p>
    <div class="status">
        Website Offline
    </div>
    <br>
    <button id="themeBtn">
        Dark Mode
    </button>
    <footer>
        Last updated:
        <span id="lastUpdate"></span>
    </footer>
</div>

<script>
const root = document.documentElement;
const btn = document.getElementById("themeBtn");
const saved = localStorage.getItem("theme");
if (saved) {
    root.classList.toggle("dark", saved === "dark");
} else {
    root.classList.toggle(
        "dark",
        window.matchMedia("(prefers-color-scheme: dark)").matches
    );
}
updateButton();
btn.onclick = () => {
    root.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        root.classList.contains("dark") ? "dark" : "light"
    );
    updateButton();
};
function updateButton() {
    btn.textContent = root.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";
}
const lastUpdate = new Date("2026-06-29T18:00:00Z");
document.getElementById("lastUpdate").textContent =
    lastUpdate.toLocaleString(undefined,{
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
</script>

</body>
</html>
